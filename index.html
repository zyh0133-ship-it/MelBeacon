<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelBeacon 灯塔系统 · 工作台</title>
  <meta http-equiv="refresh" content="0; url=./工作台/index.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #0D2818 0%, #1A3A24 100%);
      color: #fff;
    }
    .box { text-align: center; padding: 40px; }
    .logo { font-size: 56px; margin-bottom: 20px; }
    .title { font-size: 22px; font-weight: 600; margin-bottom: 12px; color: #F9A825; }
    .sub { font-size: 14px; opacity: 0.75; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 999px;
      background: #F9A825;
      color: #0D2818;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 24px rgba(249,168,37,0.35);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(249,168,37,0.5); }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #F9A825;
      margin: 0 4px;
      animation: blink 1.2s infinite both;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.9); }
      40% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🗼</div>
    <div class="title">MelBeacon 灯塔系统</div>
    <div class="sub">正在进入工作台<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <a class="btn" href="./工作台/index.html">立即进入 →</a>
  </div>
</body>
</html>
