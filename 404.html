<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MelBeacon · 跳转中...</title>
  <script>
    // GitHub Pages 对仓库名大小写敏感，自动把小写 melbeacon 跳回驼峰 MelBeacon
    (function() {
      var path = window.location.pathname;
      var corrected = path.replace(/\/melbeacon\//i, '/MelBeacon/');
      if (corrected !== path) {
        window.location.replace(corrected);
      } else {
        // 其他 404，跳回首页
        window.location.replace('/MelBeacon/');
      }
    })();
  </script>
  <style>
    body { font-family: -apple-system, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; background: #0D2818; color:#fff; margin:0; }
    .box { text-align:center; }
    .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.2); border-top-color:#F9A825; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { color:#F9A825; font-size:18px; margin:0 0 8px; }
    p { opacity:0.7; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>正在跳转...</h1>
    <p>如果没有自动跳转，请点击 <a href="/MelBeacon/" style="color:#F9A825">这里</a></p>
  </div>
</body>
</html>
